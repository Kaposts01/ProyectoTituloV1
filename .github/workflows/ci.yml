name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://crm:test-password@localhost:5432/crm
      VIRTUALPOS_BASE_URL: https://virtualpos.example.test
      VIRTUALPOS_API_KEY: test-api-key
      VIRTUALPOS_SECRET_KEY: test-secret-key
      AUTH_JWT_SECRET: test-jwt-secret-with-at-least-32-characters
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_PASSWORD: test-admin-password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: alembic upgrade head
      - run: python -m ruff check app tests alembic scripts
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
