name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://crm:test-password@localhost:5432/crm
      VIRTUALPOS_BASE_URL: https://virtualpos.example.test
      VIRTUALPOS_API_KEY: test-api-key
      VIRTUALPOS_SECRET_KEY: test-secret-key
      AUTH_JWT_SECRET: test-jwt-secret-with-at-least-32-characters
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_PASSWORD: test-admin-password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: alembic upgrade head
      - run: python -m ruff check app tests alembic scripts
      # MET-01: la suite sigue siendo bloqueante; la cobertura es solo reporte (sin --cov-fail-under).
      - run: python -m pytest --cov=app --cov=scripts --cov-report=term --cov-report=xml:coverage.xml
      - name: Resumen de cobertura (no bloqueante)
        if: always()
        continue-on-error: true
        run: |
          python -m coverage report --format=markdown --sort=cover > coverage.md
          {
            echo "## Cobertura backend (pytest-cov, solo reporte)"
            echo
            echo "Total: $(python -m coverage report --format=total)%"
            echo
            echo "<details><summary>Detalle por archivo</summary>"
            echo
            cat coverage.md
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Subir cobertura backend
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: |
            coverage.xml
            coverage.md
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # REV-01 (origin/sprint-5/estabilizacion-dashboard 1005a26): la CI corre tambien las pruebas del frontend.
      # MET-01: con cobertura v8 (solo reporte, sin umbrales); las pruebas siguen siendo bloqueantes.
      - run: npm run test:coverage
      - name: Resumen de cobertura (no bloqueante)
        if: always()
        continue-on-error: true
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["## Cobertura frontend (vitest v8, solo reporte)", "", "| Métrica | % | Cubiertas/total |", "|---|---|---|",
              ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Subir cobertura frontend
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: |
            frontend/coverage/coverage-summary.json
            frontend/coverage/lcov.info
          if-no-files-found: ignore
      - run: npm run build
